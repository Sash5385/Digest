<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<title>Ежедневные дайджесты</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;600&display=swap">
<style>
/* Стиль «Туман»: два дайджеста рядом на весь экран, на телефоне переключение вкладками */
:root {
  --bg: #0a0b0d;
  --glass: rgba(255, 255, 255, 0.045);
  --glass-line: rgba(255, 255, 255, 0.09);
  --fg: #e8edf0;
  --muted: #8d99a3;
  --accent: #5fd6c3;
  --accent-soft: rgba(95, 214, 195, 0.14);
  --orb-a: #2fb7a3;
  --orb-b: #6a5cf0;
  --orb-c: #3a86d9;
  --font-display: "Unbounded", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow: hidden;
  padding-top: calc(18px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.orbs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.orb { position: absolute; border-radius: 50%; opacity: 0.5; filter: blur(100px); }
.o1 { width: 460px; height: 460px; background: var(--orb-a); top: -140px; left: -120px; }
.o2 { width: 520px; height: 520px; background: var(--orb-b); top: 30vh; right: -220px; }
.o3 { width: 420px; height: 420px; background: var(--orb-c); bottom: -160px; left: 30%; }
.top { position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(20px, 3vw, 28px); line-height: 1.15; margin: 0; }
h1 em { font-style: normal; color: var(--accent); }
.tabs { display: none; gap: 6px; }
.tab { font: 500 13px var(--font-body); color: var(--muted); background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.tab:focus-visible, .col-head a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cols { position: relative; z-index: 1; flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.col { display: flex; flex-direction: column; min-height: 0; min-width: 0; border: 1px solid var(--glass-line); border-radius: 16px; background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); overflow: hidden; }
.col-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--glass-line); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.col-head a { color: var(--accent); text-decoration: none; white-space: nowrap; }
.col-head a:hover { text-decoration: underline; }
iframe { flex: 1; min-height: 0; width: 100%; border: 0; background: transparent; }
@media (prefers-reduced-motion: no-preference) {
  .orb { animation: drift 40s ease-in-out infinite alternate; }
  .o2 { animation-duration: 52s; }
  .o3 { animation-duration: 64s; }
  @keyframes drift { to { transform: translate3d(40px, -30px, 0); } }
}
@media (max-width: 999px) {
  .tabs { display: flex; }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .col { display: none; }
  body[data-view="claude"] #claude, body[data-view="kyiv"] #kyiv { display: flex; }
}
</style>
</head>
<body data-view="claude">
<div class="orbs" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>

<header class="top">
  <h1>Ежедневные <em>дайджесты</em></h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" type="button" data-view="claude" aria-selected="true">Claude Code</button>
    <button class="tab" role="tab" type="button" data-view="kyiv" aria-selected="false">Киев</button>
  </div>
</header>

<main class="cols">
  <section class="col" id="claude">
    <div class="col-head"><span>Claude Code</span><a href="/claude/">Открыть отдельно ↗</a></div>
    <iframe src="/claude/" title="Claude Code Дайджест"></iframe>
  </section>
  <section class="col" id="kyiv">
    <div class="col-head"><span>Инфопанель Киев</span><a href="/kyiv/">Открыть отдельно ↗</a></div>
    <iframe src="/kyiv/" title="Инфопанель Киев"></iframe>
  </section>
</main>

<script>
(function () {
  var tabs = document.querySelectorAll('.tab');
  function show(v) {
    document.body.dataset.view = v;
    tabs.forEach(function (t) { t.setAttribute('aria-selected', t.dataset.view === v ? 'true' : 'false'); });
  }
  tabs.forEach(function (t) {
    t.addEventListener('click', function () {
      show(t.dataset.view);
      try { history.replaceState(null, '', '#' + t.dataset.view); } catch (e) {}
    });
  });
  if (location.hash === '#kyiv') show('kyiv');
})();
</script>
</body>
</html>
